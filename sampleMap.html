<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="theme-selector-wrap">
      <span class="section-label">ARENA THEME</span>

      <div class="theme-pill" data-theme="classic">
        <button class="pill-arrow prev" aria-label="Previous Theme">
          &#10094;
        </button>

        <div class="theme-center">
          <span class="theme-swatch"></span>
          <span class="theme-name">Classic Grid</span>
        </div>

        <div class="pill-right-controls">
          <button class="map-info-btn" aria-label="Map Info">i</button>
          <button class="pill-arrow next" aria-label="Next Theme">
            &#10095;
          </button>
        </div>

        <!-- Full-pill overlay matching the Game Mode .info-drawer -->
        <div class="map-info-drawer">
          <p>
            <strong>Classic Grid (64×64):</strong> Off-white tile floor with
            slate-blue cover blocks.
          </p>
        </div>
      </div>

      <div class="theme-dots">
        <span class="t-dot active"></span>
        <span class="t-dot"></span>
        <span class="t-dot"></span>
      </div>
    </div>

    <style>
      .theme-selector-wrap {
        max-width: 460px;
        margin: 16px auto 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .section-label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.4px;
        color: #94a3b8;
        margin-bottom: 8px;
        padding-left: 12px;
      }

      .theme-pill {
        position: relative;
        height: 54px;
        border-radius: 999px;
        border: 2px solid #38bdf8;
        background-color: #162638;
        background-image:
          linear-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.12) 1px, transparent 1px);
        background-size: 16px 16px;
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        overflow: hidden; /* Clips the full-pill info overlay cleanly to the rounded edges */
        user-select: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background-color 0.2s;
      }

      .theme-pill[data-theme="sandstone"] {
        border-color: #f59e0b;
        background-color: #2c2117;
        background-image:
          linear-gradient(rgba(245, 158, 11, 0.14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 158, 11, 0.14) 1px, transparent 1px);
        box-shadow: 0 0 18px rgba(245, 158, 11, 0.2);
      }
      .theme-pill[data-theme="cyber"] {
        border-color: #22d3ee;
        background-color: #0b1120;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 121, 249, 0.14) 1px, transparent 1px);
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
      }

      .pill-arrow {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: rgba(15, 23, 42, 0.65);
        color: #e2e8f0;
        font-size: 15px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .pill-arrow:hover {
        background: rgba(56, 189, 248, 0.25);
        transform: scale(1.08);
      }

      .theme-center {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .theme-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: linear-gradient(135deg, #f1f5f9 50%, #64748b 50%);
        border: 1.5px solid #ffffff;
      }
      .theme-pill[data-theme="sandstone"] .theme-swatch {
        background: linear-gradient(135deg, #f5efe6 50%, #c2855a 50%);
      }
      .theme-pill[data-theme="cyber"] .theme-swatch {
        background: linear-gradient(135deg, #0f172a 50%, #06b6d4 50%);
      }

      .theme-name {
        font-size: 17px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.3px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }

      .pill-right-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Keep 'i' button above the overlay (z-index: 4) just like .info-btn */
      .map-info-btn {
        position: relative;
        z-index: 4;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        background: rgba(15, 23, 42, 0.85);
        color: #ffffff;
        font-size: 12px;
        font-weight: 800;
        font-style: italic;
        font-family: Georgia, serif;
        cursor: pointer;
      }

      /* Identical full-container frosted overlay to .info-drawer */
      .map-info-drawer {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 76px 0 24px; /* Leaves room on the right so the 'i' button stays unobstructed */
        text-align: center;
        color: #cbd5e1;
        font-size: 12.5px;
        line-height: 1.3;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .map-info-drawer p {
        margin: 0;
      }
      .map-info-drawer strong {
        color: #ffffff;
      }

      .pill-right-controls:has(.map-info-btn:hover) + .map-info-drawer,
      .pill-right-controls:has(.map-info-btn:focus) + .map-info-drawer {
        opacity: 1;
        pointer-events: auto;
      }

      .theme-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
      }
      .t-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #334155;
      }
      .t-dot.active {
        width: 18px;
        background: #38bdf8;
      }
    </style>
  </body>
</html>
